name: social_media_app
description: "A social media app(clone Instagram)"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7
  google_fonts: ^6.2.1
  carousel_slider: ^5.1.1
  scrollable_positioned_list: ^0.3.8
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  photo_manager: ^3.7.1
  photo_manager_image_provider: ^2.2.0
  pro_image_editor: ^9.13.0
  image: ^4.5.4
  camera: ^0.11.2
  video_player: ^2.10.0
  video_trimmer: ^5.0.0
  ffmpeg_kit_flutter_new: ^3.2.0
  pro_video_editor: ^0.2.3
  supabase_flutter: ^2.10.0
  google_sign_in: ^6.2.1
  app_links: ^6.4.1
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  mime: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"   # khi máy dùng dark mode
  image: assets/app_icon/app_icon.png
  android_12:
    image: assets/app_icon/app_icon.png
    color: "#ffffff"
    color_dark: "#000000"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon/display_icon.png"

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/videos/
    - assets/app_icon/
    - assets/avt/
